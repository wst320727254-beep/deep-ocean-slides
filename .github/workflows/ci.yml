name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# The CLI and the linter print Chinese; force UTF-8 so Windows runners do not
# fall back to cp1252 (the CLI also reconfigures its own streams).
env:
  PYTHONIOENCODING: utf-8

jobs:
  test:
    name: ${{ matrix.os }} · py${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.9", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Unit tests
        run: python -m pytest -q
      - name: Build the reference deck
        run: python -m deepocean demo -o out
      - name: Lint the reference deck in strict mode
        run: python -m deepocean check out/deep-ocean-demo.pptx --strict --no-color
      - name: Lint the reference deck source (strict)
        run: python -m deepocean check examples/demo-deck.yaml --strict
      - name: Design-token introspection
        run: python -m deepocean tokens --md > tokens.md
      - uses: actions/upload-artifact@v4
        if: matrix.os == 'ubuntu-latest' && matrix.python == '3.12'
        with:
          name: deep-ocean-demo
          path: |
            out/deep-ocean-demo.pptx
            out/deep-ocean-demo.html
            out/deep-ocean-demo.yaml
            tokens.md

  examples:
    name: examples match the schema
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - name: Every layout in the schema is exercised by an example
        run: python tests/check_examples.py
