        - -83.6
        - -85.9
        - -81.1
        color: navy
      - name: 搜索渠道
        values:
        - 7.1
        - 6.3
        - 7.1
        - 6.4
        color: teal
      unit: '%'
      height: 390
      note: 所有系数在 1% 水平显著（GMV 搜索 +0.584, p<0.1）
    kpis:
    - value: −33.4%
      label: 推荐渠道 浏览 PV
      note: −39.03***
      tone: down
    - value: +7.1%
      label: 搜索渠道 浏览 PV
      note: +8.532***
      tone: up
    - value: 22%
      label: 浏览 PV 补偿比例
      note: 搜索补回推荐损失的两成
      tone: flat
    cards:
    - title: 越靠后的漏斗环节，补偿越弱
      body: 浏览 22% → 点击 7%，订单与 GMV 基本靠价格与库存而非搜索补回。
      tone: plain
    takeaway:
      label: IV 弹性
      text: 推荐 PV 每减少 1 单位，搜索 PV 增加 0.219***（95% 置信区间不含 0）
- layout: split_cards
  kicker: 06 · HETEROGENEITY
  title: 品类异质性：互补还是替代，由品类决定
  subtitle: 同一实验、同样的算法改动，26 个品类走向两端
  data:
    ratio: 0.56
    left:
      chip: COMPLEMENTARY
      chip_en: 互补
      title: 家具 / 杂货：推荐带动搜索
      body: 需要多轮比较、决策链路长的品类，推荐位把用户送进搜索做深挖。
      items:
      - 家具：推荐 +328%，搜索 +26%
      - 杂货：推荐 +320%，搜索 +26%
      footer: Table 3 · 互补品类
      tone: accent
    right:
      chip: SUBSTITUTION
      chip_en: 替代 / 无效应
      title: 服装 / 鞋包 / 母婴：补不回来
      body: 偏好稳定、可即时决策的品类，推荐位本身就是决策终点。
      items:
      - 服装：推荐 −91%，搜索 +9%
      - 鞋 / 包：推荐 −94%，搜索 0%（0.0243 n.s.）
      - 母婴：推荐 −95%，搜索 0%（0.0281 n.s.）
      footer: Table 4 · 替代与无效应品类
      tone: danger
- layout: concept_flow
  kicker: 07 · FRAMEWORK
  title: 概念框架：推荐先形成考虑集，搜索再满足需求
  subtitle: 互补与替代，差在推荐是否把用户推向搜索
  data:
    left:
      title: 推荐 · 形成阶段
      body: 推荐位压缩搜索成本，把候选商品摆到用户面前。
      items:
      - 个性化越强，越接近用户偏好
      - 禁用个人数据 → 只能推大众爆款
    center:
      label: ⇄
      note: update
    right:
      title: 搜索 · 满足阶段
      body: 用户用查询把需求显性化，搜索承担深度比较。
      items:
      - 互补品类：推荐把用户送进搜索
      - 替代品类：推荐直接终结决策
    takeaway: 推荐不是在替搜索，而是在决定用户是否需要搜索 —— 取决于品类的决策链路长度
- layout: matrix2x2
  kicker: 08 · MECHANISM
  title: 2×2 机制矩阵：兴趣与品类共同决定补偿强度
  subtitle: 消费者兴趣 × 品类关系
  data:
    aside:
      title: 两个维度
      body: 用历史行为刻画兴趣高低，用品类回归结果区分互补与替代。
      items:
      - 横轴：兴趣爱好强度
      - 纵轴：互补 / 替代
      - 读数：推荐与搜索的 PV 变化
      axes:
        x: 兴趣 低 → 高
        y: 替代 → 互补
    quadrants:
    - 'no': LT
      title: 互补 · 低兴趣
      condition: 推荐 +369%
      result: 搜索 +30%
      note: N = 1,057,396 · 补偿最强
      tone: accent
    - 'no': RT
      title: 互补 · 高兴趣
      condition: 推荐 +48%
      result: 搜索 +12%
      note: N = 54,204 · 用户已知道自己要什么
      tone: tint
    - 'no': LB
      title: 替代 · 低兴趣
      condition: 推荐 −91%
      result: 搜索 0%（−0.00510 n.s.）
      note: N = 12,837,604 · 完全不补
      tone: danger
    - 'no': RB
      title: 替代 · 高兴趣
      condition: 推荐 −92%
      result: 搜索 +10%
      note: N = 501,596 · 补一点点
      tone: alert
    center_label: PV
- layout: chart_insight
  kicker: 09 · EVIDENCE
  title: NLP 搜索词证据：搜索行为确实变了
  subtitle: 搜索词的通用性与长度，按四象限拆解（%）
  hero: false
  data:
    side_ratio: 0.62
    chart:
      type: bar
      title: 搜索查询特征变化
      categories:
      - 互补·高兴趣
      - 互补·低兴趣
      - 替代·高兴趣
      - 替代·低兴趣
      series:
      - name: 通用词占比
        values:
        - 19
        - 13
        - 3
        - 8
        color: navy
      - name: 查询长度
        values:
        - 2
        - 0
        - 4
        - 1
        color: teal
      unit: '%'
      height: 400
      note: 互补品类搜索更泛化（0.0337***、0.0238***），替代品类搜索更具体（0.115***）
    cards:
    - title: 互补：搜索变“宽”
      body: 通用词占比 +19% / +13%，用户在推荐启发的方向上开阔搜索。
      tone: tint
    - title: 替代：搜索变“窄”
      body: 查询长度 +4%、+1%，用户是在核价与确认，而非发现新品。
      tone: plain
    takeaway:
      label: 解读
      text: 搜索词结构变化说明：补偿不是同一种行为，互补是发现、替代是确认
