- layout: key_findings
  kicker: 10 · FINDINGS
  title: 关键发现与启示
  subtitle: 推荐抑制个人数据后：平台损失了什么，用户得到了什么
  data:
    banner:
      heading: 三个必须记住的数字
      figures:
      - value: −33.4%
        unit: ''
        label: 推荐渠道浏览 PV
        tone: down
      - value: +7.1%
        unit: ''
        label: 搜索渠道浏览 PV
        tone: up
      - value: 22%
        unit: ''
        label: 搜索对推荐的补偿比例
        tone: flat
    cards:
    - title: 对平台：隐私保护有代价，但代价因品类而异
      body: 整体补偿只有 22%，但在互补品类里搜索能补回三成，替代品类几乎为零。
      tone: plain
    - title: 对研究：替代与互补是品类属性，不是平台属性
      body: 同一实验、同一算法改动，26 个品类分成两极；用平台层面均值讨论隐私成本会失真。
      tone: tint
    - title: 下一步：把品类机制做成可预测的指标
      body: 决策链路长度、复购周期、SKU 丰富度能否提前预测补偿强度，是值得跟进的方向。
      tone: primary
    cards_ratio: 0.36
- layout: closing
  kicker: 11 · CONCLUSION
  title: 总结与展望
  data:
    quote:
      text: 切断个人数据不会让用户停止购物，但会让他们换个方式找东西 —— 而这个“方式”由品类决定。
      source: 'Yuan, Chen, Wang & Sun (2025), ISR 36(1): 84-106'
    panels:
    - title: 局限
      body: 单一平台、单一算法、一个常规日；GMV 的搜索系数仅 10% 水平显著。
      tone: plain
    - title: 未来
      body: 跨平台复现、把兴趣刻画换成实时行为序列、检验长期推荐多样性对搜索的影响。
      tone: primary
    thanks: 感谢聆听 · 欢迎批评指正
