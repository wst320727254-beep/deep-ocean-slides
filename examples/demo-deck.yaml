pages:
- layout: cover
  title: 推荐如何影响消费者搜索
  title_en: A Field Experiment on Recommendation and Search
  data:
    english_title: 'How Recommendation Affects Customer Search: A Field Experiment'
    authors: 汇报人 · 研之有理队
    affiliation: 管理科学与工程 · 文献组会 · 2026 年 10 月
    series: ISR · 2025
    note: 样本 555,800 名用户 · 26 个产品类目 · 一个无大促的常规日
    band: 'Yuan, Chen, Wang & Sun (2025), Information Systems Research 36(1): 84-106'
- layout: two_column
  kicker: 01 · BACKGROUND
  title: 研究背景
  subtitle: 算法推荐与主动搜索，是替代还是互补？
  data:
    ratio: 0.6
    left:
      title: 个性化推荐正在替用户做选择
      body: 电商平台用协同过滤把个人历史行为压缩成推荐位。当个人数据被切断，算法只能退回大众爆款，推荐位的个性化程度随之崩塌。
      items:
      - 推荐位的流量高度依赖个人数据（人口统计、浏览、点击、购买）
      - 搜索是用户自己表达需求的渠道，与推荐形成两种不同的信息获取方式
      - 已有研究多在观测数据上争论替代/互补，缺少随机实验证据
      footer: 文献缺口：缺少在同一实验里同时观察推荐与搜索的田野证据
    right:
    - chip: IDENTIFICATION
      chip_en: 识别策略
      title: 切断个人数据
      body: 处理组推荐算法只输入商品与商家特征，个人数据被禁用。
      tone: tint
    - chip: SCALE
      chip_en: 实验规模
      title: 555,800 名用户
      body: 头部电商平台，20 亿+ 商品、数千万卖家、数亿买家。
      tone: plain
    - chip: QUESTION
      chip_en: 研究问题
      title: 搜索能否补回推荐损失
      body: 推荐渠道下滑时，搜索渠道的补偿比例究竟有多大？
      tone: plain
    - title: 本文答案：品类决定关系
      body: 互补品类的搜索被推荐带动，替代品类的搜索几乎补不回来。
      tone: primary
- layout: big_number
  kicker: 02 · QUESTIONS
  title: 三个科学问题
  subtitle: 从主效应到机制，逐层收窄
  hero: false
  data:
    mode: hero
    items:
    - number: '01'
      title: 主效应：推荐减少多少，搜索增加多少
      body: 禁用个人数据后，推荐与搜索渠道的浏览、点击、订单、销售额如何变化？
      tone: primary
    - number: '02'
      title: 异质性：为什么会分化
      body: 26 个品类里，哪些品类呈现互补、哪些呈现替代？
      tone: accent
    - number: '03'
      title: 机制：兴趣与查询特征
      body: 消费者兴趣水平与搜索词的通用性/长度解释了这种分化吗？
      tone: neutral
- layout: experiment_design
  kicker: 03 · DESIGN
  title: 实验设计
  subtitle: 同一天、同一批用户、单变量差异
  data:
    steps:
    - label: STEP 1
      text: 选定一个无大促的常规日，锁定首页推荐曝光
    - label: STEP 2
      text: 随机分流：对照组保留个人数据，处理组禁用
    - label: STEP 3
      text: 在同一时间窗观测推荐与搜索两条渠道
    groups:
      left:
        title: Control · 对照组
        body: 推荐算法输入 = 商品 + 商家 + 个人数据
        items:
        - 人口统计
        - 历史浏览 / 点击 / 购买
        - 个性化排序
        tone: plain
      right:
        title: Treatment · 处理组
        body: 推荐算法输入 = 商品 + 商家（禁用个人数据）
        items:
        - 退化为 popularity-based
        - 大众爆款优先
        - 个性化排序失效
        tone: tint
    vs: VS
    verdict: 唯一差异是个人数据是否进入推荐算法 —— 渠道差异可归因于推荐个性化
- layout: roadmap
  kicker: 04 · METHOD
  title: 技术路线
  subtitle: 从实验到机制的四步证据链
  data:
    aside:
      title: 识别与推断
      body: 以处理分配为工具变量，剥离推荐渠道的内生性，再用品类分组检验异质性。
      items:
      - 协同过滤 CF 推荐
      - ITT + IV 弹性
      - 26 品类分组回归
      - NLP 查询特征
      footer: N = 555,800
    steps:
    - 'no': '01'
      title: 主效应估计
      body: 对比两组的推荐/搜索渠道 PV、点击、订单、GMV。
      meta: Table 1 · Table 2
    - 'no': '02'
      title: 渠道弹性
      body: 用处理分配做 IV，估计推荐 → 搜索的替代/互补弹性。
      meta: IV 弹性
    - 'no': '03'
      title: 品类异质性
      body: 分品类估计，识别互补、替代与无效应三类。
      meta: Table 3 · Table 4
    - 'no': '04'
      title: 机制检验
      body: 兴趣高低 × 互补替代四象限 + 搜索词 NLP 特征。
      meta: Table 5 – Table 8
- layout: chart_insight
  kicker: 05 · MAIN EFFECT
  title: 主效应：推荐塌陷，搜索只补回一小部分
  subtitle: 禁用个人数据后各渠道相对变化（%）
  hero: true
  data:
    side_ratio: 0.6
    chart:
      type: bar
      title: 推荐渠道与搜索渠道的变化幅度
      categories:
      - 浏览 PV
      - 点击
      - 订单
      - 销售额
      series:
      - name: 推荐渠道
        values:
